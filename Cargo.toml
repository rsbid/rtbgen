[workspace]
members = ["crates/rtbgen", "crates/rtbgen-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
# proptest 1.12 requires 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Deterministic OpenRTB 2.5/2.6 bid request generator for tests, fuzzing and load tests"
keywords = ["openrtb", "advertising", "adtech", "testing", "fuzz"]
categories = ["development-tools::testing"]
repository = "https://github.com/rsbid/rtbgen"
documentation = "https://docs.rs/rtbgen"
# Publishing stays off until the first release
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
warnings = "deny"
let_underscore_drop = "warn"
unused_results = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
elided_lifetimes_in_paths = "warn"
redundant_imports = "warn"
closure_returning_async_block = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
trivial_casts = "warn"
ambiguous_negative_literals = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
macro_use_extern_crate = "warn"
if_let_rescope = "warn"
tail_expr_drop_order = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
as_conversions = "deny"
unwrap_in_result = "deny"
mem_forget = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
try_err = "deny"
return_and_then = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
assertions_on_result_states = "deny"
get_unwrap = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
iter_over_hash_type = "deny"
str_to_string = "deny"
string_add = "deny"
infinite_loop = "deny"
else_if_without_else = "deny"
wildcard_enum_match_arm = "deny"
if_then_some_else_none = "deny"
semicolon_outside_block = "deny"
verbose_file_reads = "deny"
create_dir = "deny"
pathbuf_init_then_push = "deny"
filetype_is_file = "deny"
large_include_file = "deny"
default_numeric_fallback = "deny"
unseparated_literal_suffix = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
field_scoped_visibility_modifiers = "deny"
partial_pub_fields = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
unneeded_field_pattern = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
use_debug = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
map_with_unused_argument_over_ranges = "deny"
single_char_lifetime_names = "deny"
shadow_unrelated = "deny"
disallowed_types = "deny"
