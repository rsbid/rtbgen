[workspace]
members = ["crates/rtbgen", "crates/rtbgen-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic OpenRTB 2.5/2.6 bid request generator for tests, fuzzing and load tests"
keywords = ["openrtb", "advertising", "adtech", "testing", "fuzz"]
categories = ["development-tools::testing"]
# Publishing stays off until the first release
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
disallowed_types = "deny"
