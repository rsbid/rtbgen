cognitive-complexity-threshold = 15
too-many-arguments-threshold = 4
type-complexity-threshold = 250
too-many-lines-threshold = 80
excessive-nesting-threshold = 4

enum-variant-size-threshold = 64
large-error-threshold = 64
future-size-threshold = 4096
max-struct-bools = 1
max-fn-params-bools = 1
pass-by-value-size-limit = 64
trivial-copy-size-limit = 16
array-size-threshold = 1024
stack-size-threshold = 65536
vec-box-size-threshold = 256

# A hash map in the generation path is deterministic within one process and
# different in the next one. Iterate arrays; BTreeMap only where iteration
# order cannot reach the output.
disallowed-types = ["std::collections::HashMap", "std::collections::HashSet"]
