[package]
name = "rtbgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "../../README.md"
publish = true

[lints]
workspace = true

[features]
default = ["alloc"]
alloc = []
arbitrary = ["dep:arbitrary", "alloc"]
proptest = ["dep:proptest", "alloc"]
serde = ["dep:serde", "dep:serde_json", "alloc"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
arbitrary = { version = "1.5", default-features = false, optional = true }
proptest = { version = "1.12", default-features = false, features = ["std"], optional = true }
serde = { version = "1", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"], optional = true }

[dev-dependencies]
arbitrary = "1.5"
lib_tcstring = "0.5.0"
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde_json = "1"

[[example]]
name = "06_fuzz_target"
required-features = ["arbitrary"]
